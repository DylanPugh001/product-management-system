<section class="login-section">
  <!-- Subtle vignette -->
  <div class="vignette" aria-hidden="true"></div>

  <!-- Animated accent lines -->
  <div class="accent-lines" aria-hidden="true">
    <div class="hline"></div>
    <div class="hline"></div>
    <div class="hline"></div>
    <div class="vline"></div>
    <div class="vline"></div>
    <div class="vline"></div>
  </div>

  <!-- Particles -->
  <canvas #particleCanvas class="particles" aria-hidden="true"></canvas>

  <!-- Header -->
  <header class="topbar">
    <span class="brand">Product Management System</span>
  </header>

  <!-- Centered login card -->
  <div class="center">
    <div class="login-card">
      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to create, manage, and approve products.</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="20" height="16" x="2" y="4" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
            <input id="email" type="email" formControlName="email" placeholder="you@company.com" autocomplete="username" />
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="toggle-password"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
              (click)="togglePassword()"
            >
              @if (showPassword()) {
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path>
                  <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path>
                  <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path>
                  <path d="m2 2 20 20"></path>
                </svg>
              } @else {
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              }
            </button>
          </div>
        </div>

        @if (error()) {
          <p class="error">{{ error() }}</p>
        }

        <button type="submit" class="sign-in" [disabled]="form.invalid || loading()">
          {{ loading() ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>

      @if (isDev) {
        <div class="demo-hint">
          <p class="demo-title">Demo accounts</p>
          <p class="demo-account"><strong>capturer@demo.local</strong> / Demo123!</p>
          <p class="demo-account"><strong>manager@demo.local</strong> / Demo123!</p>
        </div>
      }
    </div>
  </div>
</section>
